# Self-hosted circtime monitor that publishes a public-safe static build.
#
# Usage (from the repository root):
#   CIRCTIME_DATA=/srv/circtime docker compose -f deploy/compose.yml up -d
#
# - Host networking so loopback health URLs work; no ports are published.
#   The container never listens; another web server serves ${CIRCTIME_DATA}/dist.
# - config.yml stays outside the served directory and is mounted read-only.
# - History and build caches live in ${CIRCTIME_DATA}/state (keep it private).
name: circtime

services:
  monitor:
    image: node:22-alpine
    container_name: circtime-monitor
    network_mode: host
    restart: unless-stopped
    init: true
    user: "${CIRCTIME_UID:-1000}:${CIRCTIME_GID:-1000}"
    working_dir: /state
    command: ["node", "/app/deploy/monitor.mjs"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      HOME: /state/home
      npm_config_cache: /state/npm-cache
      npm_config_update_notifier: "false"
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ..:/app:ro
      - ${CIRCTIME_CONFIG_DIR:-..}/config.yml:/config/config.yml:ro
      - ${CIRCTIME_DATA:?set CIRCTIME_DATA to the data directory}/state:/state
      - ${CIRCTIME_DATA}/dist:/out
    healthcheck:
      # Healthy when a check cycle finished within the last 5 minutes.
      test: ["CMD", "node", "-e", "const t=Number(require('fs').readFileSync('/state/heartbeat','utf8'));process.exit(Date.now()-t<300000?0:1)"]
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
